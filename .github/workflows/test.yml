name: Diagnose zlib arm64

on:
  push:
    branches:
      - codex/diagnose-zlib-arm64

permissions:
  contents: read

jobs:
  test:
    name: zlib (linux-arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out formulas
        uses: actions/checkout@v7

      - name: Check out llar
        uses: actions/checkout@v7
        with:
          repository: goplus/llar
          ref: 36ba7c64a7ccbb67e37731e34d828360650c65f6
          path: .llar-source

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential ca-certificates cmake curl gperf groff patch

      - name: Install LLVM 19 on Linux
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$RUNNER_TEMP/apt.llvm.org.asc"
          sudo install -m 644 "$RUNNER_TEMP/apt.llvm.org.asc" /usr/share/keyrings/apt.llvm.org.asc
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 llvm-19
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake gperf groff llvm@19 lld@19
          echo "$(brew --prefix llvm@19)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld@19)/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .llar-source/go.mod
          cache: false

      - name: Verify runner platform
        shell: bash
        run: |
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "arm64"

      - name: Install llar
        working-directory: .llar-source
        run: |
          go install -ldflags="-checklinkname=0" ./cmd/llar
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Inspect zlib cache before test
        shell: bash
        run: |
          cache_root="${XDG_CACHE_HOME:-$HOME/.cache}/.llar/workspaces"
          archive="$cache_root/madler/zlib@v1.3.2-arm64-linux/lib/libz.a"
          metadata="$cache_root/madler/zlib/.cache.json"
          if [[ -f "$metadata" ]]; then
            printf "Cache index exists before test:\n"
            sed -n '1,160p' "$metadata"
          else
            printf "No zlib cache index before test\n"
          fi
          if [[ -f "$archive" ]]; then
            printf "Archive exists before test:\n"
            sha256sum "$archive"
            llvm-readobj --file-headers "$archive" | sed -n '1,42p'
          else
            printf "No zlib archive before test\n"
          fi

      # TODO: Add version-range support to `llar test`.
      # For example, test a changed formula from `fromVer "1.0.0"` instead of the latest source tag.
      - name: Test module
        run: llar test --verbose "./zlib" --os "linux" --arch "arm64"

      - name: Inspect installed zlib and published artifacts
        if: always()
        shell: bash
        run: |
          cache_root="${XDG_CACHE_HOME:-$HOME/.cache}/.llar/workspaces"
          archive="$cache_root/madler/zlib@v1.3.2-arm64-linux/lib/libz.a"
          metadata="$cache_root/madler/zlib/.cache.json"
          printf "Runner architecture: "; uname -m
          printf "Installed archive:\n"
          file "$archive"
          sha256sum "$archive"
          llvm-readobj --file-headers "$archive" | sed -n '1,42p'
          printf "Installed zlib header version:\n"
          grep '^#define ZLIB_VERSION' "$cache_root/madler/zlib@v1.3.2-arm64-linux/include/zlib.h"
          printf "Cache index after test:\n"
          if [[ -f "$metadata" ]]; then
            sed -n '1,160p' "$metadata"
          fi
          printf "Published archive comparison:\n"
          for platform in arm64-linux amd64-linux; do
            download="$RUNNER_TEMP/zlib-$platform.tar.gz"
            status="$(curl --silent --show-error --location --max-time 30 --max-filesize 2097152 \
              --output "$download" --write-out '%{http_code}' \
              "https://llarpackages.xgo.dev/madler/zlib/v1.3.2/$platform.tar.gz")"
            printf "%s HTTP %s\n" "$platform" "$status"
            if [[ "$status" == "200" ]]; then
              tar -xOzf "$download" lib/libz.a | sha256sum
            fi
          done
